<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CarbonSynq | Account access</title><link rel="stylesheet" href="/operations/style.css"><script src="/operations/account.js" defer></script></head><body><main class="account-shell"><section class="account-card"><a class="brand" href="/university"><span class="mark">C</span> CarbonSynq</a><p class="eyebrow">CONTROLLED ACCOUNT ACCESS</p><h1 id="heading">Recover your account</h1><p class="muted" id="description">Enter your university ID and work email. We never disclose whether an account exists.</p><form id="recover"><label>University ID<input name="tenantId" required autocomplete="organization"></label><label>Work email<input name="email" type="email" required autocomplete="username"></label><button class="primary">Request recovery link</button></form><form id="complete" hidden><label>New password<input name="newPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>Confirm password<input name="confirmPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button class="primary">Save password &amp; complete</button></form><p id="message" role="status" class="fine"></p><p class="fine">Links expire and work once. Invitations are not accepted automatically. Existing sessions are revoked after password recovery.</p><a href="/operations">Return to sign-in &rarr;</a></section></main></body></html>
