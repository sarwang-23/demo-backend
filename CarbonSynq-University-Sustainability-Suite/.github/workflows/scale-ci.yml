name: Scale API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: cs_owner
          POSTGRES_PASSWORD: ci-owner-only-password-not-production
          POSTGRES_DB: carbonsynq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cs_owner -d carbonsynq_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: scale-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r python/requirements-test.txt
      # Generate/review/commit a lockfile, then change this to npm ci before release.
      - run: npm install --ignore-scripts --no-fund --no-audit
      - run: npm run check
      - run: npm run check:university
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_ADMIN_URL: postgres://cs_owner:ci-owner-only-password-not-production@127.0.0.1:5432/carbonsynq_test
      - run: npm run test:university:postgres
        env:
          TEST_DATABASE_ADMIN_URL: postgres://cs_owner:ci-owner-only-password-not-production@127.0.0.1:5432/carbonsynq_test
      - run: npm run test:carbon:postgres
        env:
          TEST_DATABASE_ADMIN_URL: postgres://cs_owner:ci-owner-only-password-not-production@127.0.0.1:5432/carbonsynq_test
      - run: npm run test:ingestion:postgres
        env:
          TEST_DATABASE_ADMIN_URL: postgres://cs_owner:ci-owner-only-password-not-production@127.0.0.1:5432/carbonsynq_test
      - run: npm run test:operations:postgres
        env:
          TEST_DATABASE_ADMIN_URL: postgres://cs_owner:ci-owner-only-password-not-production@127.0.0.1:5432/carbonsynq_test
      - run: npm run test:operations:ocr
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        working-directory: .
